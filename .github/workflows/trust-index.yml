name: Trust Index

# The autonomous half of this project. Rebuilds the public MCP Package Trust
# Index on a schedule and raises an issue the moment a package appears
# impersonating an official publisher scope. Runs whether or not anyone is
# watching.

on:
  schedule:
    - cron: '41 5 * * *'   # daily, off the hour so it does not pile onto GitHub's busiest minute
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-index.mjs'
      - 'src/**'
      - '.github/workflows/trust-index.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: trust-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the trust index
        env:
          # Without a token the advisories API allows 60 requests an hour, which
          # is far short of a full malware-feed scan.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-index.mjs

      - name: Commit the refreshed index
        run: |
          set -euo pipefail
          git config user.name  'mcpaudit-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # docs/trust is generated output, so there is nothing to merge: this
          # run's build is authoritative by definition. Rebasing it against a
          # concurrent human commit only produces conflicts in files neither
          # side hand-edited, which is exactly how the previous attempt wedged
          # itself into a detached HEAD with unmerged paths.
          #
          # Replay instead of merge: set aside the build, fast-forward to
          # whatever main looks like now, put the build back, commit, push.
          cp -R docs/trust "${RUNNER_TEMP}/trust-build"

          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            git checkout -q -B main origin/main
            git reset -q --hard origin/main

            rm -rf docs/trust
            mkdir -p docs
            cp -R "${RUNNER_TEMP}/trust-build" docs/trust

            git add docs/trust
            if git diff --staged --quiet; then
              echo "index unchanged"
              exit 0
            fi
            git commit -q -m "Trust index: automated refresh"

            if git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — main moved again, replaying (attempt $attempt)"
          done
          echo "::error::could not push the refreshed index after 3 attempts"
          exit 1

      - name: Raise an issue if an impersonation appeared
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(cat .impersonations 2>/dev/null || echo 0)
          if [ "$count" = "0" ]; then
            echo "no impersonations detected"
            exit 0
          fi

          # One open alert at a time; the issue body always carries the current list.
          existing=$(gh issue list --state open --label impersonation --json number --jq '.[0].number' || true)
          body=$(node -e "
            const d=require('./docs/trust/data.json');
            console.log('Automated sweep probed '+d.sweep.probed+' homoglyph variants of official publisher scopes and found '+d.sweep.hits.length+' package(s) impersonating one.\n');
            for (const h of d.sweep.hits) {
              console.log('### \`'+h.name+'\`\n');
              console.log('- Impersonates: \`'+h.impersonates+'\`');
              console.log('- First published: '+h.created);
              console.log('- npm maintainer: '+h.maintainers);
              console.log('- Declared author: '+h.author+'\n');
            }
            console.log('A lookalike package may be byte-identical to the official one today and hostile after its next release. Verify before installing, and pin versions.\n');
            console.log('Generated '+d.generated+' by the Trust Index workflow.');
          ")

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            echo "updated issue #$existing"
          else
            gh issue create \
              --title "Impersonation packages detected on npm" \
              --label impersonation \
              --body "$body"
          fi
